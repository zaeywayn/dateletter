<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dateletter</title>

    <style>

    .invitation.show .brand {
    animation: fadeUp 0.8s ease 0.2s both;
}

.invitation.show .symbol {
    animation: fadeUp 0.8s ease 0.35s both;
}

.invitation.show .dear {
    animation: fadeUp 0.8s ease 0.5s both;
}

.invitation.show .message {
    animation: fadeUp 0.9s ease 0.65s both;
}

.invitation.show .details {
    animation: fadeUp 0.8s ease 0.8s both;
}

.invitation.show .buttons {
    animation: fadeUp 0.8s ease 0.95s both;
}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}
      
.create-screen {
    display: none;

    flex-direction: column;
    align-items: center;
    text-align: center;

    width: 100%;
    max-width: 430px;
}

.create-brand {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 5px;

    color: #777;

    margin-bottom: 80px;
}

.create-screen h1 {
    font-size: 30px;
    font-weight: normal;

    margin-bottom: 20px;
}

.create-screen p {
    font-size: 16px;
    line-height: 1.6;

    color: #888;

    margin-bottom: 40px;
}

.create-screen button {
    max-width: 260px;
}
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #111;
            color: #f5f1e8;
            font-family: Georgia, serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        /* =========================
           OPENING SCREEN
        ========================= */

        .opening {
            position: fixed;
            inset: 0;

            background: #111;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            z-index: 10;

            transition: opacity 1s ease;
        }

        .opening.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .opening-brand {
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 5px;

            color: #777;

            margin-bottom: 70px;
        }

        .opening-symbol {
            font-size: 22px;

            margin-bottom: 30px;
        }

        .opening-text {
            font-size: 24px;
            line-height: 1.5;

            max-width: 300px;

            margin-bottom: 45px;
        }

        .open-button {
            width: 180px;

            padding: 15px;

            background: transparent;
            color: #f5f1e8;

            border: 1px solid #666;

            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;

            cursor: pointer;

            transition: all 0.3s ease;
        }

        .open-button:hover {
            background: #f5f1e8;
            color: #111;
        }

      .themes {
    display: flex;
    gap: 6px;

    margin-bottom: 35px;
}

.themes button {
    width: auto;

    padding: 8px 10px;

    font-size: 8px;
    letter-spacing: 1px;

    color: #666;
    border-color: #333;
}

      body.paper {
    background: #e8e1d2;
    color: #211f1a;
}

body.paper .invitation {
    border-color: #aaa;
}

body.paper .brand {
    color: #777;
}

body.paper .details {
    color: #5f5a50;
}

      body.paper .time {
    color: #3f3a32;
      }
      
body.paper button {
    color: #211f1a;
    border-color: #999;
}


body.romance {
    background: #211719;
    color: #f4e7e4;
}

body.romance .invitation {
    border-color: #594346;
}

body.romance .brand,
body.romance .details {
    color: #a88f93;
}

body.romance button {
    color: #f4e7e4;
    border-color: #594346;
}
        /* =========================
           INVITATION
        ========================= */

        .invitation {
    width: 100%;
    max-width: 430px;
    min-height: 700px;

    border: 1px solid #333;

    padding: 55px 30px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    opacity: 0;

    transform: translateY(20px);

    transition:
        opacity 1s ease,
        transform 1s ease;

    position: relative;
        }
      
        .invitation.show {
            opacity: 1;
            transform: translateY(0);
        }

        .brand {
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 5px;

            color: #999;

            margin-bottom: 45px;
        }

        .symbol {
            font-size: 20px;

            margin-bottom: 30px;
        }

        .dear {
            font-size: 18px;
            font-weight: normal;

            margin-bottom: 28px;
        }

        .message {
            font-size: 27px;
            line-height: 1.45;

            max-width: 350px;

            margin-bottom: 45px;
        }

        .details {
            font-family: Arial, sans-serif;
            font-size: 12px;

            letter-spacing: 1px;
            line-height: 1.8;

            color: #aaa;

            margin-bottom: 35px;
        }

        .time {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    letter-spacing: 2px;
    margin-bottom: 12px;
        }

        .dates {
    margin-top: 8px;

    display: flex;
    justify-content: center;
    gap: 8px;
}

.date-option {
    width: 45px;
    padding: 10px 5px;

    color: #777;
    border: 1px solid #333;

    font-size: 11px;
    letter-spacing: 0;

    background: transparent;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease;
}

.date-option.selected {
    background: #f5f1e8;
    color: #111;
    border-color: #f5f1e8;
    transform: translateY(-3px);
}

.selected-date {
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
      
.selected-date {
    margin-top: 15px;

    font-family: Arial, sans-serif;
    font-size: 10px;

    letter-spacing: 1px;
    color: #aaa;
}

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;

            width: 100%;
            max-width: 260px;
        }
.buttons.fade-out {
    opacity: 0;
    transform: translateY(-8px);
    transition:
        opacity 0.5s ease,
        transform 0.5s ease;
}

.response {
    opacity: 0;
    transform: translateY(10px);
}

.response.show {
    opacity: 1;
    transform: translateY(0);
    transition:
        opacity 0.8s ease,
        transform 0.8s ease;
}
      
        button {
            width: 100%;

            padding: 14px 20px;

            background: transparent;
            color: #f5f1e8;

            border: 1px solid #666;

            font-family: Arial, sans-serif;
            font-size: 10px;

            letter-spacing: 2px;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        button:hover {
            background: #f5f1e8;
            color: #111;
        }

      button:active {
    transform: scale(0.97);
      }
      
        .not-interested {
            border-color: #333;
            color: #777;
        }

        .response {
    display: none;

    margin-top: 30px;

    font-size: 18px;
    line-height: 1.5;

    color: #ddd;

    opacity: 0;
    transform: translateY(10px);
        }
body.paper .response {
    color: #3f3a32;
      }

      body.romance .response {
    color: #f0e1df;
  }
.response strong {
    font-size: 25px;
    font-weight: normal;
}

@keyframes responseIn {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

      }

        .footer {
            margin-top: 45px;

            font-family: Arial, sans-serif;
            font-size: 8px;

            letter-spacing: 2px;

            color: #555;
        }

      @media (max-width: 480px) {

    body {
        padding: 12px;
    }

    .invitation {
        min-height: 100vh;
        padding: 45px 20px;
    }

    .brand {
        margin-bottom: 45px;
    }

    .message {
        font-size: 25px;
        max-width: 320px;
    }

    .details {
        margin-bottom: 30px;
    }

    .buttons {
        max-width: 240px;
    }

}

      body.paper .not-interested {
    color: #777;
    border-color: #bbb;
}

body.romance .not-interested {
    color: #776568;
    border-color: #49373a;
      }

      body.paper .opening {
    background: #e8e1d2;
    color: #211f1a;
}

body.paper .opening-brand {
    color: #777;
}

body.paper .opening-symbol {
    color: #211f1a;
}

body.paper .opening-text {
    color: #211f1a;
}

body.paper .open-button {
    color: #211f1a;
    border-color: #999;
}

body.paper .open-button:hover {
    background: #211f1a;
    color: #e8e1d2;
}
    </style>
</head>


<body>
<section class="create-screen" id="create-screen">

    <div class="create-brand">
        DATELETTER
    </div>

    <h1>Create your Dateletter</h1>

    <p>
        Create an invitation worth opening.
    </p>

    <button onclick="showInvitation()">
        CREATE INVITATION
    </button>

</section>

    <!-- =========================
         OPENING
    ========================= -->

    <section class="opening" id="opening">

        <div class="opening-brand">
            DATELETTER
        </div>
      <div class="themes">

    <button onclick="changeTheme('midnight')">
        MIDNIGHT
    </button>

    <button onclick="changeTheme('paper')">
        PAPER
    </button>

    <button onclick="changeTheme('romance')">
        ROMANCE
    </button>

      </div>

        <div class="opening-symbol">
            ✦
        </div>

        <p class="opening-text">
            Someone left you<br>
            an invitation.
        </p>

        <button class="open-button" onclick="openInvitation()">
            OPEN
        </button>

    </section>



    <!-- =========================
         INVITATION
    ========================= -->

    <main class="invitation" id="invitation">

        <div class="brand">
            DATELETTER
        </div>

        <div class="symbol">
            ✦
        </div>

<h1 class="dear" id="recipient-name">
    Dear Amel,
</h1>
        </h1>

        <p class="message">
            Would you let me treat you like a princess for one night?
        </p>

        <div class="details">

            <div class="time">
                22.00
            </div>

            <<div class="dates">
    <button class="date-option" onclick="selectDate('21 September')">
        21
    </button>

    <button class="date-option" onclick="selectDate('22 September')">
        22
    </button>

    <button class="date-option" onclick="selectDate('23 September')">
        23
    </button>

    <button class="date-option" onclick="selectDate('24 September')">
        24
    </button>
</div>

<div id="selected-date" class="selected-date">
    Choose a date
</div>
                21 — 24
            </>

            <div>
                JOGJA
            </div>

        </div>


        <div class="buttons">

            <button onclick="respond('yes')">
                I'D LOVE TO
            </button>

            <button onclick="respond('maybe')">
                MAYBE
            </button>

            <button
                class="not-interested"
                onclick="respond('no')">

                NOT INTERESTED

            </button>

        </div>


        <div
            id="response"
            class="response">
        </div>


        <div class="footer">
            AN INVITATION WORTH OPENING
        </div>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>
function showInvitation() {

    document.getElementById("create-screen")
        .style.display = "none";

    document.getElementById("opening")
        .style.display = "flex";

}
        function openInvitation() {

            const opening =
                document.getElementById("opening");

            const invitation =
                document.getElementById("invitation");


            opening.classList.add("hidden");

            setTimeout(function() {

                invitation.classList.add("show");

            }, 500);

        }

function saveResponse(date, answer) {

    const scriptURL =
        "https://script.google.com/macros/s/AKfycbxzn5kaaIheLHOLfEsLiahF4OsZAClBisuY-5myzzUdsvu7RpQ0ys1foH0cHlD_nneX/exec";

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain"
        },
        body: JSON.stringify({
            date: date,
            response: answer
        })
    });

}

function respond(answer) {

    const response =
        document.getElementById("response");

    const buttons =
        document.querySelector(".buttons");

    const date =
        document.getElementById("selected-date").innerHTML;
saveResponse(date, answer);
    if (answer === "yes") {
        response.innerHTML =
            "<strong>It's a date. ♡</strong><br><br>" +
            date +
            "<br><br>" +
            "I'll see you there.";
    }

    else if (answer === "maybe") {
        response.innerHTML =
            "<strong>Take your time.</strong><br><br>" +
            "There's no pressure. ♡";
    }

    else if (answer === "no") {
        response.innerHTML =
            "<strong>Thank you for being honest.</strong><br><br>" +
            "I respect that. ♡";
    }

    buttons.classList.add("fade-out");

    setTimeout(function() {

        buttons.style.display = "none";

        response.style.display = "block";

        setTimeout(function() {
            response.classList.add("show");
        }, 50);

    }, 500);
}

      
function selectDate(date, button) {

    const selectedDate =
        document.getElementById("selected-date");

    selectedDate.innerHTML =
        "Selected: " + date;

    const buttons =
        document.querySelectorAll(".date-option");

    buttons.forEach(function(button) {
        button.classList.remove("selected");
    });

    button.classList.add("selected");
}

      function changeTheme(theme) {

    document.body.classList.remove(
        "midnight",
        "paper",
        "romance"
    );

    document.body.classList.add(theme);

      }
    </script>


</body>
</html>
